name: Sync upstream latest Release to Gitee

on:
  schedule:
    - cron: "20 3 * * *"  # 每天 UTC 03:20 跑一次
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch upstream latest release
        id: upstream
        run: |
          set -euo pipefail
          UPSTREAM="clash-verge-rev/clash-verge-rev"
          curl -sS "https://api.github.com/repos/${UPSTREAM}/releases/latest" > latest.json

          tag=$(python3 - <<'PY'
          import json
          d=json.load(open("latest.json","r",encoding="utf-8"))
          print(d.get("tag_name",""))
          PY
          )
          if [ -z "$tag" ]; then
            echo "No latest release found"; cat latest.json; exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Check if Gitee already has this tag release
        id: check
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_OWNER: ${{ secrets.GITEE_OWNER }}
          GITEE_REPO:  ${{ secrets.GITEE_REPO }}
          TAG:         ${{ steps.upstream.outputs.tag }}
        run: |
          set -euo pipefail
          curl -sS "https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}/releases?access_token=${GITEE_TOKEN}&page=1&per_page=100" > gitee_releases.json

          exists=$(python3 - "$TAG" <<'PY'
          import json, sys
          tag = sys.argv[1]
          arr = json.load(open("gitee_releases.json","r",encoding="utf-8"))
          print("1" if any(r.get("tag_name")==tag for r in arr) else "0")
          PY
          )
          echo "exists=$exists" >> "$GITHUB_OUTPUT"

      - name: Done (already synced)
        if: ${{ steps.check.outputs.exists == '1' }}
        run: echo "Already synced tag ${{ steps.upstream.outputs.tag }}"

      - name: Create release on Gitee
        if: ${{ steps.check.outputs.exists != '1' }}
        id: create
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_OWNER: ${{ secrets.GITEE_OWNER }}
          GITEE_REPO:  ${{ secrets.GITEE_REPO }}
        run: |
          set -euo pipefail

          tag=$(python3 -c "import json;print(json.load(open('latest.json'))['tag_name'])")
          name=$(python3 -c "import json;d=json.load(open('latest.json'));print(d.get('name') or d['tag_name'])")
          body=$(python3 -c "import json;d=json.load(open('latest.json'));print(d.get('body') or '')")
          prerelease=$(python3 -c "import json;d=json.load(open('latest.json'));print('true' if d.get('prerelease') else 'false')")

          curl -sS "https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}?access_token=${GITEE_TOKEN}" > repo.json
          default_branch=$(python3 -c "import json;print(json.load(open('repo.json')).get('default_branch','master'))")
          echo "Gitee default_branch=${default_branch}"

          resp=$(curl -sS --fail-with-body -X POST "https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}/releases" \
            -F "access_token=${GITEE_TOKEN}" \
            -F "tag_name=${tag}" \
            -F "target_commitish=${default_branch}" \
            -F "name=${name}" \
            -F "body=${body}" \
            -F "prerelease=${prerelease}")

          echo "$resp" > gitee_created.json
          rid=$(python3 - <<'PY'
          import json
          d=json.load(open("gitee_created.json","r",encoding="utf-8"))
          print(d.get("id",""))
          PY
          )
          if [ -z "$rid" ]; then
            echo "Create release failed:"
            cat gitee_created.json
            exit 1
          fi
          echo "release_id=$rid" >> "$GITHUB_OUTPUT"

      - name: Download upstream assets
        if: ${{ steps.check.outputs.exists != '1' }}
        run: |
          set -euo pipefail
          mkdir -p assets
          python3 - <<'PY'
          import json, urllib.request, pathlib
          d=json.load(open("latest.json","r",encoding="utf-8"))
          for a in d.get("assets", []):
              url=a["browser_download_url"]
              name=a["name"]
              out=pathlib.Path("assets")/name
              print("Downloading", name)
              urllib.request.urlretrieve(url, out)
          PY

      - name: Upload assets to Gitee release (5% progress, low-noise)
        if: ${{ steps.check.outputs.exists != '1' && hashFiles('assets/*') != '' }}
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_OWNER: ${{ secrets.GITEE_OWNER }}
          GITEE_REPO:  ${{ secrets.GITEE_REPO }}
          RELEASE_ID:  ${{ steps.create.outputs.release_id }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          # Ensure pv exists, install quietly (avoid dpkg progress spam)
          if ! command -v pv >/dev/null 2>&1; then
            echo "Installing pv..."
            sudo apt-get update -qq >/dev/null 2>&1
            sudo apt-get install -y -qq -o Dpkg::Use-Pty=0 -o Dpkg::Progress-Fancy=0 pv >/dev/null 2>&1
          fi

          echo "{}" > assets_map.json

          for f in assets/*; do
            bn=$(basename "$f")
            sz=$(stat -c%s "$f" 2>/dev/null || stat -f%z "$f")
            echo "Uploading $bn (size=${sz} bytes)"

            success=0
            for attempt in 1 2 3 4 5; do
              tmp_body="$(mktemp)"
              echo "  attempt ${attempt}/5"

              # pv: force progress in CI, refresh interval, % output to stderr
              # awk: only print every 5%, and flush immediately to avoid buffering
              if http_code=$(
                pv -f -n -i 0.2 "$f" 2> >(
                  awk -v fn="$bn" '
                    BEGIN{last=-1}
                    {
                      p=int($1+0.5);
                      if (p<0) p=0; if (p>100) p=100;
                      if (p%5==0 && p!=last) {
                        printf("  %s %d%%\n", fn, p) > "/dev/stderr";
                        fflush("/dev/stderr");
                        last=p;
                      }
                    }
                  '
                ) | curl -sS --fail-with-body \
                    --connect-timeout 20 \
                    -o "$tmp_body" -w "%{http_code}" \
                    -X POST "https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}/releases/${RELEASE_ID}/attach_files" \
                    -F "access_token=${GITEE_TOKEN}" \
                    -F "release_id=${RELEASE_ID}" \
                    -F "file=@-;filename=${bn};type=application/octet-stream"
              ); then
                url=$(python3 - "$tmp_body" <<'PY'
          import json,sys
          p=sys.argv[1]
          d=json.load(open(p,"r",encoding="utf-8"))
          def pick(x):
              if isinstance(x, dict):
                  return x.get("browser_download_url") or x.get("download_url") or x.get("url") or ""
              if isinstance(x, list) and x:
                  return pick(x[0])
              return ""
          print(pick(d))
          PY
                )
                rm -f "$tmp_body"

                if [ -z "$url" ]; then
                  echo "ERROR: upload succeeded but no url returned: $bn (http=$http_code)"
                  success=0
                else
                  python3 - "$bn" "$url" <<'PY'
          import json,sys
          fn,url=sys.argv[1],sys.argv[2]
          m=json.load(open("assets_map.json","r",encoding="utf-8"))
          m[fn]=url
          json.dump(m, open("assets_map.json","w",encoding="utf-8"), ensure_ascii=False, indent=2)
          PY
                  echo "  OK: $bn"
                  success=1
                fi

                if [ "$success" -eq 1 ]; then
                  break
                fi
              else
                echo "ERROR: upload failed: $bn (http=$http_code)"
                echo "----- response body -----"
                cat "$tmp_body" || true
                echo "-------------------------"
                rm -f "$tmp_body"
                sleep 3
              fi
            done

            if [ "$success" -ne 1 ]; then
              echo "WARN: giving up on $bn after 5 attempts"
            fi

            # throttle between files to reduce rate-limit risk
            sleep 1
          done

          echo "assets_map.json (from upload responses):"
          cat assets_map.json

      - name: Refresh assets_map.json by listing Gitee attachments (most reliable)
        if: ${{ steps.check.outputs.exists != '1' && hashFiles('assets/*') != '' }}
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_OWNER: ${{ secrets.GITEE_OWNER }}
          GITEE_REPO:  ${{ secrets.GITEE_REPO }}
          RELEASE_ID:  ${{ steps.create.outputs.release_id }}
        run: |
          set -euo pipefail

          curl -sS --fail-with-body \
            "https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}/releases/${RELEASE_ID}/attach_files?access_token=${GITEE_TOKEN}&page=1&per_page=200" > gitee_attach_files.json

          python3 - <<'PY'
          import json
          arr=json.load(open("gitee_attach_files.json","r",encoding="utf-8"))
          m={}
          if isinstance(arr, list):
              for it in arr:
                  if not isinstance(it, dict):
                      continue
                  name=it.get("name") or it.get("filename") or ""
                  url=it.get("browser_download_url") or it.get("download_url") or it.get("url") or ""
                  if name and url:
                      m[name]=url
          json.dump(m, open("assets_map.json","w",encoding="utf-8"), ensure_ascii=False, indent=2)
          print("attachments:", len(m))
          PY

          echo "assets_map.json (from attach_files list):"
          cat assets_map.json

      - name: Rewrite release body links to Gitee and update
        if: ${{ steps.check.outputs.exists != '1' }}
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_OWNER: ${{ secrets.GITEE_OWNER }}
          GITEE_REPO:  ${{ secrets.GITEE_REPO }}
          RELEASE_ID:  ${{ steps.create.outputs.release_id }}
        run: |
          set -euo pipefail

          python3 -c 'import json; d=json.load(open("latest.json","r",encoding="utf-8")); \
          open("meta.json","w",encoding="utf-8").write(json.dumps({ \
            "tag_name": d["tag_name"], \
            "name": (d.get("name") or d["tag_name"]), \
            "body": (d.get("body") or ""), \
            "prerelease": bool(d.get("prerelease")) \
          }, ensure_ascii=False))'

          python3 -c 'import json,re,os; meta=json.load(open("meta.json","r",encoding="utf-8")); \
          m=json.load(open("assets_map.json","r",encoding="utf-8")) if os.path.exists("assets_map.json") else {}; \
          body=meta["body"]; \
          pat=re.compile(r"https://github\.com/[^/\s]+/[^/\s]+/releases/download/[^/\s]+/([^\s\)\]]+)"); \
          new_body=pat.sub(lambda mm: m.get(mm.group(1), mm.group(0)), body); \
          meta["body"]=new_body; \
          open("meta_rewritten.json","w",encoding="utf-8").write(json.dumps(meta, ensure_ascii=False)); \
          print("Matched:", len(pat.findall(body))); \
          print("Replaced:", sum(1 for fn in pat.findall(body) if fn in m))'

          python3 -c 'import json; meta=json.load(open("meta_rewritten.json","r",encoding="utf-8")); \
          patch={ \
            "access_token":"'"${GITEE_TOKEN}"'", \
            "tag_name": meta["tag_name"], \
            "name": meta["name"], \
            "body": meta["body"], \
            "prerelease": meta["prerelease"] \
          }; \
          open("patch.json","w",encoding="utf-8").write(json.dumps(patch, ensure_ascii=False))'

          echo "PATCH release body to Gitee..."
          resp=$(curl -sS --fail-with-body -X PATCH \
            "https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}/releases/${RELEASE_ID}" \
            -H "Content-Type: application/json" \
            --data-binary @patch.json)

          echo "PATCH response:"
          echo "$resp"
