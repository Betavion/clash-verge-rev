name: Sync upstream latest Release to Gitee

on:
  schedule:
    - cron: "20 3 * * *"  # 每天 UTC 03:20 跑一次
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch upstream latest release
        id: upstream
        run: |
          set -euo pipefail
          UPSTREAM="clash-verge-rev/clash-verge-rev"
          curl -sS "https://api.github.com/repos/${UPSTREAM}/releases/latest" > latest.json

          tag=$(python3 - <<'PY'
          import json
          d=json.load(open("latest.json","r",encoding="utf-8"))
          print(d.get("tag_name",""))
          PY
          )
          if [ -z "$tag" ]; then
            echo "No latest release found"; cat latest.json; exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Find existing Gitee release for this tag
        id: find
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_OWNER: ${{ secrets.GITEE_OWNER }}
          GITEE_REPO:  ${{ secrets.GITEE_REPO }}
          TAG:         ${{ steps.upstream.outputs.tag }}
        run: |
          set -euo pipefail

          exists="0"
          rid=""

          page=1
          while true; do
            curl -sS --fail-with-body \
              "https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}/releases?access_token=${GITEE_TOKEN}&page=${page}&per_page=100" > gitee_releases_page.json

            n=$(python3 - <<'PY'
          import json
          arr=json.load(open("gitee_releases_page.json","r",encoding="utf-8"))
          print(len(arr) if isinstance(arr,list) else 0)
          PY
            )
            if [ "$n" -eq 0 ]; then
              break
            fi

            found=$(python3 - "$TAG" <<'PY'
          import json,sys
          tag=sys.argv[1]
          arr=json.load(open("gitee_releases_page.json","r",encoding="utf-8"))
          if not isinstance(arr,list):
              print("")
              raise SystemExit
          for r in arr:
              if isinstance(r,dict) and r.get("tag_name")==tag:
                  print(str(r.get("id","")))
                  break
          else:
              print("")
          PY
            )

            if [ -n "$found" ]; then
              exists="1"
              rid="$found"
              break
            fi

            page=$((page+1))
            if [ "$page" -gt 50 ]; then
              break
            fi
          done

          echo "exists=$exists" >> "$GITHUB_OUTPUT"
          echo "release_id=$rid" >> "$GITHUB_OUTPUT"

          if [ "$exists" = "1" ]; then
            echo "Found existing Gitee release id=$rid for tag=$TAG (will verify assets/body)."
          else
            echo "No existing Gitee release for tag=$TAG (will create)."
          fi

      - name: Create release on Gitee (if missing)
        if: ${{ steps.find.outputs.exists != '1' }}
        id: create
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_OWNER: ${{ secrets.GITEE_OWNER }}
          GITEE_REPO:  ${{ secrets.GITEE_REPO }}
        run: |
          set -euo pipefail

          tag=$(python3 -c "import json;print(json.load(open('latest.json'))['tag_name'])")
          name=$(python3 -c "import json;d=json.load(open('latest.json'));print(d.get('name') or d['tag_name'])")
          body=$(python3 -c "import json;d=json.load(open('latest.json'));print(d.get('body') or '')")
          prerelease=$(python3 -c "import json;d=json.load(open('latest.json'));print('true' if d.get('prerelease') else 'false')")

          curl -sS "https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}?access_token=${GITEE_TOKEN}" > repo.json
          default_branch=$(python3 -c "import json;print(json.load(open('repo.json')).get('default_branch','master'))")
          echo "Gitee default_branch=${default_branch}"

          resp=$(curl -sS --fail-with-body -X POST "https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}/releases" \
            -F "access_token=${GITEE_TOKEN}" \
            -F "tag_name=${tag}" \
            -F "target_commitish=${default_branch}" \
            -F "name=${name}" \
            -F "body=${body}" \
            -F "prerelease=${prerelease}")

          echo "$resp" > gitee_created.json
          rid=$(python3 - <<'PY'
          import json
          d=json.load(open("gitee_created.json","r",encoding="utf-8"))
          print(d.get("id",""))
          PY
          )
          if [ -z "$rid" ]; then
            echo "Create release failed:"
            cat gitee_created.json
            exit 1
          fi
          echo "release_id=$rid" >> "$GITHUB_OUTPUT"
          echo "Created Gitee release id=$rid"

      - name: Resolve RELEASE_ID (safe with set -u)
        id: rid
        run: |
          set -euo pipefail
          rid=""
          if [ "${{ steps.find.outputs.exists }}" = "1" ]; then
            rid="${{ steps.find.outputs.release_id }}"
          else
            rid="${{ steps.create.outputs.release_id }}"
          fi

          if [ -z "$rid" ]; then
            echo "ERROR: RELEASE_ID is empty."
            exit 1
          fi

          echo "release_id=$rid" >> "$GITHUB_OUTPUT"
          echo "RELEASE_ID=$rid" >> "$GITHUB_ENV"
          echo "Using RELEASE_ID=$rid"

      - name: Plan wanted assets and compute missing list (only .deb/.exe <= 100MB)
        id: plan
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_OWNER: ${{ secrets.GITEE_OWNER }}
          GITEE_REPO:  ${{ secrets.GITEE_REPO }}
          RELEASE_ID:  ${{ steps.rid.outputs.release_id }}
        run: |
          set -euo pipefail
          mkdir -p assets

          python3 - <<'PY'
          import json
          d=json.load(open("latest.json","r",encoding="utf-8"))
          exts=(".deb",".exe")
          max_size=100*1024*1024
          wanted=[]
          for a in d.get("assets", []):
              name=a.get("name","")
              size=int(a.get("size") or 0)
              url=a.get("browser_download_url","")
              if not name.lower().endswith(exts):
                  continue
              if size<=0 or not url:
                  continue
              if size>max_size:
                  continue
              wanted.append({"name":name,"size":size,"url":url})
          json.dump(wanted, open("wanted_assets.json","w",encoding="utf-8"), ensure_ascii=False, indent=2)
          print("wanted_count", len(wanted))
          PY

          wanted_count=$(python3 -c "import json;print(len(json.load(open('wanted_assets.json','r',encoding='utf-8'))))")
          echo "wanted_count=$wanted_count" >> "$GITHUB_OUTPUT"

          echo "[]" > gitee_attach_all.json
          ok="1"
          page=1
          while true; do
            set +e
            code=$(curl -sS -o gitee_attach_page.json -w "%{http_code}" \
              "https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}/releases/${RELEASE_ID}/attach_files?access_token=${GITEE_TOKEN}&page=${page}&per_page=100")
            rc=$?
            set -e

            if [ $rc -ne 0 ] || [ "$code" != "200" ]; then
              ok="0"
              echo "WARN: attach_files list failed (rc=$rc http=$code). Body:"
              cat gitee_attach_page.json || true
              break
            fi

            n=$(python3 - <<'PY'
          import json
          arr=json.load(open("gitee_attach_page.json","r",encoding="utf-8"))
          print(len(arr) if isinstance(arr,list) else 0)
          PY
            )
            if [ "$n" -eq 0 ]; then
              break
            fi

            python3 - <<'PY'
          import json
          all_=json.load(open("gitee_attach_all.json","r",encoding="utf-8"))
          page=json.load(open("gitee_attach_page.json","r",encoding="utf-8"))
          if not isinstance(all_,list): all_=[]
          if isinstance(page,list): all_.extend(page)
          json.dump(all_, open("gitee_attach_all.json","w",encoding="utf-8"), ensure_ascii=False)
          PY

            page=$((page+1))
            if [ "$page" -gt 20 ]; then
              break
            fi
          done

          if [ "$ok" = "0" ]; then
            echo "Try fallback: release detail assets..."
            set +e
            code=$(curl -sS -o gitee_release_detail.json -w "%{http_code}" \
              "https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}/releases/${RELEASE_ID}?access_token=${GITEE_TOKEN}")
            rc=$?
            set -e

            if [ $rc -eq 0 ] && [ "$code" = "200" ]; then
              python3 - <<'PY'
          import json
          d=json.load(open("gitee_release_detail.json","r",encoding="utf-8"))
          arr=d.get("assets") or []
          if not isinstance(arr,list): arr=[]
          json.dump(arr, open("gitee_attach_all.json","w",encoding="utf-8"), ensure_ascii=False)
          print("fallback assets count:", len(arr))
          PY
            else
              echo "WARN: fallback release detail failed (rc=$rc http=$code). Body:"
              cat gitee_release_detail.json || true
              echo "[]"> gitee_attach_all.json
            fi
          fi

          python3 - <<'PY'
          import json
          arr=json.load(open("gitee_attach_all.json","r",encoding="utf-8"))
          m={}
          if isinstance(arr,list):
              for it in arr:
                  if not isinstance(it, dict):
                      continue
                  name=it.get("name") or it.get("filename") or ""
                  url=it.get("browser_download_url") or it.get("download_url") or it.get("url") or ""
                  if name and url:
                      m[name]=url
          json.dump(m, open("existing_assets_map.json","w",encoding="utf-8"), ensure_ascii=False, indent=2)
          json.dump(m, open("assets_map.json","w",encoding="utf-8"), ensure_ascii=False, indent=2)
          print("existing_assets:", len(m))
          PY

          python3 - <<'PY'
          import json
          wanted=json.load(open("wanted_assets.json","r",encoding="utf-8"))
          exist=json.load(open("existing_assets_map.json","r",encoding="utf-8"))
          missing=[a for a in wanted if a["name"] not in exist]
          json.dump(missing, open("missing_assets.json","w",encoding="utf-8"), ensure_ascii=False, indent=2)
          need=sum(int(a.get("size") or 0) for a in missing)
          open("need_bytes.txt","w",encoding="utf-8").write(str(need))
          open("missing_count.txt","w",encoding="utf-8").write(str(len(missing)))
          print("missing_count", len(missing))
          print("need_bytes", need)
          PY

          missing_count=$(cat missing_count.txt)
          need_bytes=$(cat need_bytes.txt)
          echo "missing_count=$missing_count" >> "$GITHUB_OUTPUT"
          echo "need_bytes=$need_bytes" >> "$GITHUB_OUTPUT"

          echo "Plan summary:"
          echo "  wanted_count=$wanted_count"
          echo "  missing_count=$missing_count"
          echo "  need_bytes=$need_bytes"

      - name: Cleanup old Gitee releases to free quota (delete whole releases)
        if: ${{ steps.plan.outputs.missing_count != '0' }}
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_OWNER: ${{ secrets.GITEE_OWNER }}
          GITEE_REPO:  ${{ secrets.GITEE_REPO }}
          NEED_BYTES:  ${{ steps.plan.outputs.need_bytes }}
          RELEASE_ID:  ${{ steps.rid.outputs.release_id }}
        run: |
          set -euo pipefail
          LIMIT=$((1024*1024*1024))
          MARGIN=$((200*1024*1024))
          need="$NEED_BYTES"
          if [ "$need" -le 0 ]; then
            echo "No bytes needed, skip cleanup."
            exit 0
          fi

          page=1
          all="[]"
          while true; do
            curl -sS --fail-with-body \
              "https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}/releases?access_token=${GITEE_TOKEN}&page=${page}&per_page=100" > rel_page.json
            n=$(python3 - <<'PY'
          import json
          arr=json.load(open("rel_page.json","r",encoding="utf-8"))
          print(len(arr) if isinstance(arr,list) else 0)
          PY
            )
            if [ "$n" -eq 0 ]; then break; fi
            all=$(python3 - "$all" <<'PY'
          import json,sys
          all_=json.loads(sys.argv[1])
          arr=json.load(open("rel_page.json","r",encoding="utf-8"))
          if isinstance(arr,list): all_.extend(arr)
          print(json.dumps(all_, ensure_ascii=False))
          PY
            )
            page=$((page+1))
            if [ "$page" -gt 50 ]; then break; fi
          done
          echo "$all" > all_releases.json

          python3 - <<'PY'
          import json, datetime
          arr=json.load(open("all_releases.json","r",encoding="utf-8"))
          def parse_dt(s):
              try: return datetime.datetime.fromisoformat(s.replace("Z","+00:00"))
              except Exception: return datetime.datetime.min
          arr=[r for r in arr if isinstance(r,dict)]
          arr.sort(key=lambda r: parse_dt(r.get("created_at","")))
          json.dump(arr, open("sorted_releases.json","w",encoding="utf-8"), ensure_ascii=False, indent=2)
          PY

          used=$(python3 - <<'PY'
          import json
          arr=json.load(open("sorted_releases.json","r",encoding="utf-8"))
          s=0
          for r in arr:
              for a in (r.get("assets") or []):
                  if isinstance(a,dict):
                      s += int(a.get("size") or 0)
          print(s)
          PY
          )
          echo "Current assets used bytes: $used"

          target=$((LIMIT - MARGIN - need))
          echo "Target used <= $target"
          if [ "$used" -le "$target" ]; then
            echo "Quota looks OK, no cleanup needed."
            exit 0
          fi

          echo "Quota insufficient, deleting oldest releases (skip current RELEASE_ID=$RELEASE_ID)..."
          while true; do
            used=$(python3 - <<'PY'
          import json
          arr=json.load(open("sorted_releases.json","r",encoding="utf-8"))
          s=0
          for r in arr:
              for a in (r.get("assets") or []):
                  if isinstance(a,dict):
                      s += int(a.get("size") or 0)
          print(s)
          PY
            )
            if [ "$used" -le "$target" ]; then
              echo "Cleanup done. used=$used <= target=$target"
              break
            fi

            rid_del=$(python3 - <<'PY'
          import json, os
          cur=os.environ.get("RELEASE_ID","")
          arr=json.load(open("sorted_releases.json","r",encoding="utf-8"))
          for r in arr:
              if str(r.get("id","")) == cur:
                  continue
              if (r.get("assets") or []):
                  print(r.get("id",""))
                  break
          PY
            )
            if [ -z "$rid_del" ]; then
              echo "No more deletable releases with assets (excluding current), but still over quota."
              break
            fi

            echo "Deleting release id=$rid_del ..."
            set +e
            code=$(curl -sS -o del_release_body.json -w "%{http_code}" -X DELETE \
              "https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}/releases/${rid_del}?access_token=${GITEE_TOKEN}")
            rc=$?
            set -e
            if [ $rc -ne 0 ] || { [ "$code" != "200" ] && [ "$code" != "204" ]; }; then
              echo "Delete release failed (http=$code). Body:"
              cat del_release_body.json || true
              echo "Stop cleanup."
              break
            fi
            echo "Deleted release id=$rid_del (http=$code)"

            # refresh sorted list
            page=1
            all="[]"
            while true; do
              curl -sS --fail-with-body \
                "https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}/releases?access_token=${GITEE_TOKEN}&page=${page}&per_page=100" > rel_page.json
              n=$(python3 - <<'PY'
          import json
          arr=json.load(open("rel_page.json","r",encoding="utf-8"))
          print(len(arr) if isinstance(arr,list) else 0)
          PY
              )
              if [ "$n" -eq 0 ]; then break; fi
              all=$(python3 - "$all" <<'PY'
          import json,sys
          all_=json.loads(sys.argv[1])
          arr=json.load(open("rel_page.json","r",encoding="utf-8"))
          if isinstance(arr,list): all_.extend(arr)
          print(json.dumps(all_, ensure_ascii=False))
          PY
              )
              page=$((page+1))
              if [ "$page" -gt 50 ]; then break; fi
            done
            echo "$all" > all_releases.json
            python3 - <<'PY'
          import json, datetime
          arr=json.load(open("all_releases.json","r",encoding="utf-8"))
          def parse_dt(s):
              try: return datetime.datetime.fromisoformat(s.replace("Z","+00:00"))
              except Exception: return datetime.datetime.min
          arr=[r for r in arr if isinstance(r,dict)]
          arr.sort(key=lambda r: parse_dt(r.get("created_at","")))
          json.dump(arr, open("sorted_releases.json","w",encoding="utf-8"), ensure_ascii=False, indent=2)
          PY
          done

      - name: Download missing upstream assets
        if: ${{ steps.plan.outputs.missing_count != '0' }}
        run: |
          set -euo pipefail
          mkdir -p assets
          python3 - <<'PY'
          import json, urllib.request, pathlib
          missing=json.load(open("missing_assets.json","r",encoding="utf-8"))
          for a in missing:
              name=a["name"]
              url=a["url"]
              out=pathlib.Path("assets")/name
              print("Downloading", name)
              urllib.request.urlretrieve(url, out)
          PY

      - name: Upload missing assets to Gitee release (progress every 5%, no retry on 400, print body)
        if: ${{ steps.plan.outputs.missing_count != '0' }}
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_OWNER: ${{ secrets.GITEE_OWNER }}
          GITEE_REPO:  ${{ secrets.GITEE_REPO }}
          RELEASE_ID:  ${{ steps.rid.outputs.release_id }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          if [ ! -f assets_map.json ]; then
            echo "{}" > assets_map.json
          fi
          : > failed_uploads.txt

          for f in assets/*; do
            bn=$(basename "$f")
            echo "Uploading $bn"

            success=0
            for attempt in 1 2 3 4 5; do
              tmp_body="$(mktemp)"
              tmp_hdr="$(mktemp)"
              echo "  attempt ${attempt}/5"

              set +e
              http_code=$(
                curl --fail-with-body --http1.1 -H "Expect:" \
                  --connect-timeout 20 \
                  -D "$tmp_hdr" \
                  -o "$tmp_body" -w "%{http_code}" \
                  -X POST "https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}/releases/${RELEASE_ID}/attach_files" \
                  -F "access_token=${GITEE_TOKEN}" \
                  -F "release_id=${RELEASE_ID}" \
                  -F "file=@${f};filename=${bn};type=application/octet-stream" \
                  2> >(
                    awk -v RS='\r' -v fn="$bn" '
                      BEGIN{last=-1}
                      {
                        gsub(/\n/,"",$0);
                        sub(/^[[:space:]]+/,"",$0);
                        if ($0 ~ /^% Total/) next;

                        split($0,a,/[[:space:]]+/);
                        if (a[1] ~ /^[0-9]+$/) {
                          p=a[1]+0;
                          if (p%5==0 && p!=last) {
                            printf("  %s %d%%\n", fn, p);
                            fflush();
                            last=p;
                          }
                          next;
                        }

                        if ($0 ~ /^curl: \(/ || $0 ~ /^Warning:/) { print; fflush(); }
                      }
                    ' >&2
                  )
              )
              rc=$?
              set -e

              if [ $rc -ne 0 ]; then
                echo "ERROR: upload failed: $bn (http=${http_code:-unknown})"
                echo "----- response headers (first 20 lines) -----"
                head -n 20 "$tmp_hdr" || true
                echo "----- response body -----"
                cat "$tmp_body" || true
                echo "-------------------------"

                rm -f "$tmp_body" "$tmp_hdr"

                if [ "${http_code:-000}" = "429" ] || [ "${http_code:-000}" = "000" ] || \
                   [ "${http_code:-000}" = "500" ] || [ "${http_code:-000}" = "502" ] || \
                   [ "${http_code:-000}" = "503" ] || [ "${http_code:-000}" = "504" ]; then
                  sleep 5
                  continue
                fi
                break
              fi

              url=$(python3 - "$tmp_body" <<'PY'
          import json,sys
          p=sys.argv[1]
          d=json.load(open(p,"r",encoding="utf-8"))
          def pick(x):
              if isinstance(x, dict):
                  return x.get("browser_download_url") or x.get("download_url") or x.get("url") or ""
              if isinstance(x, list) and x:
                  return pick(x[0])
              return ""
          print(pick(d))
          PY
              )
              rm -f "$tmp_body" "$tmp_hdr"

              if [ -z "$url" ]; then
                echo "ERROR: upload ok but no url returned: $bn (http=$http_code)"
                sleep 2
                continue
              fi

              python3 - "$bn" "$url" <<'PY'
          import json,sys
          fn,url=sys.argv[1],sys.argv[2]
          m=json.load(open("assets_map.json","r",encoding="utf-8"))
          m[fn]=url
          json.dump(m, open("assets_map.json","w",encoding="utf-8"), ensure_ascii=False, indent=2)
          PY

              echo "  OK: $bn"
              success=1
              break
            done

            if [ "$success" -ne 1 ]; then
              echo "WARN: giving up on $bn"
              echo "$bn" >> failed_uploads.txt
            fi

            sleep 1
          done

          echo "assets_map.json (current):"
          cat assets_map.json

          if [ -s failed_uploads.txt ]; then
            echo "WARN: Some assets failed to upload (listed below). Will NOT replace their links."
            cat failed_uploads.txt
          fi

      - name: Refresh assets_map.json by listing Gitee attachments (best-effort; never fail workflow)
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_OWNER: ${{ secrets.GITEE_OWNER }}
          GITEE_REPO:  ${{ secrets.GITEE_REPO }}
          RELEASE_ID:  ${{ steps.rid.outputs.release_id }}
        run: |
          set -euo pipefail

          if [ ! -f assets_map.json ]; then
            echo "{}" > assets_map.json
          fi

          echo "Refreshing attachment list for RELEASE_ID=$RELEASE_ID ..."
          echo "[]" > gitee_attach_all.json

          ok="1"
          page=1
          while true; do
            set +e
            code=$(curl -sS -o gitee_attach_page.json -w "%{http_code}" \
              "https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}/releases/${RELEASE_ID}/attach_files?access_token=${GITEE_TOKEN}&page=${page}&per_page=100")
            rc=$?
            set -e
            if [ $rc -ne 0 ] || [ "$code" != "200" ]; then
              ok="0"
              echo "WARN: attach_files list failed (rc=$rc http=$code). Keep existing assets_map.json."
              echo "----- response body -----"
              cat gitee_attach_page.json || true
              echo "-------------------------"
              break
            fi

            n=$(python3 - <<'PY'
          import json
          arr=json.load(open("gitee_attach_page.json","r",encoding="utf-8"))
          print(len(arr) if isinstance(arr,list) else 0)
          PY
            )
            if [ "$n" -eq 0 ]; then
              break
            fi

            python3 - <<'PY'
          import json
          all_=json.load(open("gitee_attach_all.json","r",encoding="utf-8"))
          page=json.load(open("gitee_attach_page.json","r",encoding="utf-8"))
          if not isinstance(all_,list): all_=[]
          if isinstance(page,list): all_.extend(page)
          json.dump(all_, open("gitee_attach_all.json","w",encoding="utf-8"), ensure_ascii=False)
          PY

            page=$((page+1))
            if [ "$page" -gt 20 ]; then
              break
            fi
          done

          if [ "$ok" = "1" ]; then
            python3 - <<'PY'
          import json
          arr=json.load(open("gitee_attach_all.json","r",encoding="utf-8"))
          m={}
          if isinstance(arr, list):
              for it in arr:
                  if not isinstance(it, dict):
                      continue
                  name=it.get("name") or it.get("filename") or ""
                  url=it.get("browser_download_url") or it.get("download_url") or it.get("url") or ""
                  if name and url:
                      m[name]=url
          json.dump(m, open("assets_map.json","w",encoding="utf-8"), ensure_ascii=False, indent=2)
          print("attachments:", len(m))
          PY
            echo "assets_map.json (refreshed):"
            cat assets_map.json
          fi

      - name: Check and fix release body links (replace only when asset exists)
        id: body
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_OWNER: ${{ secrets.GITEE_OWNER }}
          GITEE_REPO:  ${{ secrets.GITEE_REPO }}
          RELEASE_ID:  ${{ steps.rid.outputs.release_id }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          d=json.load(open("latest.json","r",encoding="utf-8"))
          meta={
            "tag_name": d["tag_name"],
            "name": (d.get("name") or d["tag_name"]),
            "body": (d.get("body") or ""),
            "prerelease": bool(d.get("prerelease"))
          }
          json.dump(meta, open("meta.json","w",encoding="utf-8"), ensure_ascii=False)
          PY

          python3 - <<'PY'
          import json,re,os
          meta=json.load(open("meta.json","r",encoding="utf-8"))
          m={}
          if os.path.exists("assets_map.json"):
              m=json.load(open("assets_map.json","r",encoding="utf-8"))
          body=meta["body"]
          pat=re.compile(r"https://github\.com/[^/\s]+/[^/\s]+/releases/download/[^/\s]+/([^\s\)\]]+)")
          meta["body"]=pat.sub(lambda mm: m.get(mm.group(1), mm.group(0)), body)
          json.dump(meta, open("meta_rewritten.json","w",encoding="utf-8"), ensure_ascii=False)
          print("Matched:", len(pat.findall(body)))
          print("Replaced:", sum(1 for fn in pat.findall(body) if fn in m))
          PY

          set +e
          code=$(curl -sS -o gitee_release_detail.json -w "%{http_code}" \
            "https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}/releases/${RELEASE_ID}?access_token=${GITEE_TOKEN}")
          rc=$?
          set -e

          current_body=""
          if [ $rc -eq 0 ] && [ "$code" = "200" ]; then
            current_body=$(python3 - <<'PY'
          import json
          d=json.load(open("gitee_release_detail.json","r",encoding="utf-8"))
          print(d.get("body") or "")
          PY
            )
          else
            echo "WARN: cannot fetch current release detail for compare (rc=$rc http=$code). Body:"
            cat gitee_release_detail.json || true
          fi

          desired_body=$(python3 - <<'PY'
          import json
          d=json.load(open("meta_rewritten.json","r",encoding="utf-8"))
          print(d.get("body") or "")
          PY
          )

          if [ -n "$current_body" ] && [ "$current_body" = "$desired_body" ]; then
            echo "Release body already up-to-date. No PATCH needed."
            echo "patched=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          python3 - <<'PY'
          import json, os
          meta=json.load(open("meta_rewritten.json","r",encoding="utf-8"))
          patch={
            "access_token": os.environ["GITEE_TOKEN"],
            "tag_name": meta["tag_name"],
            "name": meta["name"],
            "body": meta["body"],
            "prerelease": meta["prerelease"]
          }
          json.dump(patch, open("patch.json","w",encoding="utf-8"), ensure_ascii=False)
          PY

          echo "PATCH release body to Gitee..."
          resp=$(curl -sS --fail-with-body -X PATCH \
            "https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}/releases/${RELEASE_ID}" \
            -H "Content-Type: application/json" \
            --data-binary @patch.json)

          echo "PATCH response:"
          echo "$resp"
          echo "patched=1" >> "$GITHUB_OUTPUT"

      - name: Final status
        run: |
          set -euo pipefail
          echo "Final check summary:"
          echo "  tag=${{ steps.upstream.outputs.tag }}"
          echo "  RELEASE_ID=${{ steps.rid.outputs.release_id }}"
          echo "  wanted_count=${{ steps.plan.outputs.wanted_count }}"
          echo "  missing_count=${{ steps.plan.outputs.missing_count }}"
          echo "  body_patched=${{ steps.body.outputs.patched || '0' }}"
          echo "All checks completed."
